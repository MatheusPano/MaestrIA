<!-- O prompt vazado numa tela cheia. Ver assets/icons/README.md. -->
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- O `>_` é recortado da tela, e não desenhado por cima dela: assim ele
       toma a cor da linha embaixo, e a linha selecionada acende junto. -->
  <mask id="cut">
    <rect width="24" height="24" fill="#000"/>
    <rect x="1" y="1" width="22" height="22" rx="7" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.3 8.2 11.5 12 7.3 15.8"/>
      <path d="M13.7 15.8h3.6"/>
    </g>
  </mask>
  <rect width="24" height="24" fill="#000" mask="url(#cut)"/>
</svg>
