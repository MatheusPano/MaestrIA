# Uma versão vira duas coisas pra baixar.
#
# Na aba Actions, "Run workflow" na main com a versão (ex.: 2.5.0). O workflow
# sobe o pubspec, commita "release v2.5.0" na main, cria a tag e segue. Se a
# tag já existe, ele só reempacota -- é pra isso que serve rodar de novo uma
# versão já publicada.
#
# O caminho à mão continua valendo:
#
#   make bump V=1.0.3 && git commit -am '...' && git push
#   git tag v1.0.3 && git push origin v1.0.3
#
# Daí em diante é sozinho: o .deb sai de um container ubuntu:22.04 (o mesmo do
# `make deb`, então o piso de glibc é o mesmo) e o .dmg de um runner macOS, e
# os dois sobem anexados a uma release na página do repo. Ninguém mais precisa
# mandar arquivo por mensagem.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'a versão (ex.: 2.5.0) -- nova é criada, existente é reempacotada'
        required: true

permissions:
  contents: write

jobs:
  # A tag é o nome público da versão e o pubspec é o que vai dentro do pacote.
  # Divergirem é uma release que se anuncia 1.0.3 e instala 1.0.2 -- e o apt,
  # que decide atualizar pela versão do pacote, não atualizaria nada.
  #
  # O build acontece neste mesmo run, e não num disparado pelo push da tag:
  # tag empurrada com o GITHUB_TOKEN não dispara workflow nenhum.
  versao:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: qual tag?
        env:
          VERSAO: ${{ github.event.inputs.versao }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="${VERSAO#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSAO' não é uma versão (ex.: 2.5.0)."
            exit 1
          fi
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag já existe: reempacotando."
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::versão nova sai da main, e este run é de $GITHUB_REF_NAME."
            exit 1
          fi

          # O mesmo `make bump` de quem faz à mão. Se o pubspec já estava na
          # versão, não há o que commitar e a tag vai no HEAD como está.
          make bump V="$v"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet || git commit -am "release $tag"
          git tag "$tag"
          # Atômico: ou a main e a tag sobem juntas, ou nenhuma -- nada de tag
          # apontando pra um commit que a main recusou.
          git push --atomic origin HEAD:main "$tag"

      - uses: actions/checkout@v4
        with: { ref: '${{ steps.tag.outputs.tag }}' }
      - name: a tag bate com o pubspec?
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          pubspec=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -1)
          if [ "$TAG" != "v$pubspec" ]; then
            echo "::error::a tag é $TAG e o pubspec diz $pubspec -- rode 'make bump V=...' antes de taguear."
            exit 1
          fi
          echo "maestria $pubspec"

  deb:
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.versao.outputs.tag }}' }
      # O mesmo script do `make deb`: aqui o container roda nativo em vez de
      # emulado, então o que no Mac leva dezenas de minutos leva alguns.
      - run: ./packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/linux/dist/*.deb
          if-no-files-found: error

  dmg:
    needs: versao
    # arm64, e o build sai universal -- ver o `lipo` do make-dmg.sh.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.versao.outputs.tag }}' }

      # A versão do Flutter vem do Makefile, que é onde ela mora pro resto do
      # projeto: um runner que compilasse com outra não seria o mesmo app.
      - id: sdk
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION ?= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-macos-arm64-${{ steps.sdk.outputs.version }}

      - name: flutter ${{ steps.sdk.outputs.version }}
        run: |
          set -euo pipefail
          V='${{ steps.sdk.outputs.version }}'
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            curl -fsSL -o /tmp/flutter.zip \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${V}-stable.zip"
            unzip -q /tmp/flutter.zip -d "$HOME"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - run: |
          git config --global --add safe.directory "$HOME/flutter"
          flutter config --enable-macos-desktop
          flutter precache --macos

      - run: ./packaging/macos/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: packaging/macos/dist/*.dmg
          if-no-files-found: error

  publicar:
    needs: [versao, deb, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.versao.outputs.tag }}' }
      - uses: actions/download-artifact@v4
        with: { path: anexos, merge-multiple: true }

      # O SHA256SUMS é o que o app confere antes de se atualizar: release sem
      # ele não é instalada -- ver `lib/services/updater.dart`.
      #
      # `--clobber` porque rodar de novo uma versão publicada é reempacotá-la:
      # sem ele a segunda rodada morre no anexo repetido.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versao.outputs.tag }}
        run: |
          set -euo pipefail
          (cd anexos && sha256sum *.dmg *.deb > SHA256SUMS && cat SHA256SUMS)
          ls -lh anexos
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" anexos/* --clobber \
            || gh release create "$TAG" anexos/* \
                 --title "maestria ${TAG#v}" \
                 --notes-file packaging/NOTAS-DA-RELEASE.md
